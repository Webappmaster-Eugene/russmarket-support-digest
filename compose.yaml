services:
  app:
    build: .
    init: true
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      APP_ORIGIN: "${APP_ORIGIN:?APP_ORIGIN is required}"
      DATABASE_URL: "postgresql://desk:${DESK_DB_PASSWORD:?DESK_DB_PASSWORD is required}@db:5432/support_desk"
      REVIEWER_PASSWORD_HASH: "${REVIEWER_PASSWORD_HASH:?REVIEWER_PASSWORD_HASH is required}"
      SUPPORT_PASSWORD_HASH: "${SUPPORT_PASSWORD_HASH:?SUPPORT_PASSWORD_HASH is required}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [default, database]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_desk
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      DESK_DB_PASSWORD: "${DESK_DB_PASSWORD:?DESK_DB_PASSWORD is required}"
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB]
    volumes:
      - data:/var/lib/postgresql/data
      - ./scripts/postgres-role.sql:/docker-entrypoint-initdb.d/010-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$DESK_DB_PASSWORD" psql -U desk -d support_desk -h 127.0.0.1 -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [database]
    mem_limit: 384m

networks:
  database:
    internal: true

volumes:
  data:
